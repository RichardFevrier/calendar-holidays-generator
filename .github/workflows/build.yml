name: Build Calendar

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/magic-nix-cache-action@v2

      - name: Build binary
        run: nix develop --command just prod

      - name: Run generator
        run: nix develop --command sh -c './calendar-holidays-generator'

      - name: Upload calendar artifacts
        uses: actions/upload-artifact@v4
        with:
          name: calendar-ics-files
          path: output/*ics
